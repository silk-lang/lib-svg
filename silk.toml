[package]
name = "lib-svg-tasks"
version = "0.1.0"
silk-version = "0.1.0-dev.64+8214c402307b"
kind = "executable"
source = "src"
main = "tasks.silk"

[dependencies]
svg_image = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c6be578f9e005814cd779bf3723f8611d440094e", path = "modules/codec", package = "graphics-codec" }

[native]
link = [
  { static-archive = ".cache/lexbor/lib/liblexbor_static.a", os = ["macos", "linux"] },
  { search-path = ".cache/lexbor/lib", os = "windows" },
  { library = "lexbor", mode = "dynamic", os = "windows" },
  { search-path = ".cache/libarchive/lib", os = "windows" },
  { library = "archive", mode = "dynamic" },
]

[workspace]
members = [
  "bootstrap",
  "modules",
  "modules/filters",
  "modules/raster",
  "modules/text",
  "modules/render",
  "modules/gpu",
  "modules/gpu/tests",
  "modules/tests",
  "modules/bench",
  "modules/tools/wasm",
  "svg-render-test-harness",
  "xml-compatibility",
  "xml-conformance"
]
silk-version = "0.1.0-dev.64+8214c402307b"
