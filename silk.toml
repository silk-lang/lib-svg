source = "src"
main = "tasks.silk"

[dependencies]
svg_image = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c5fc48eb37e06b217ac96effa7801866e46f90ed", path = "modules/codec", package = "graphics-codec" }

[workspace]
members = [
  "bootstrap",
  "modules",
  "modules/filters",
  "modules/raster",
  "modules/text",
  "modules/render",
  "modules/gpu",
  "modules/gpu/tests",
  "modules/tests",
  "modules/bench",
  "modules/tools/wasm",
  "svg-render-test-harness",
  "xml-compatibility",
  "xml-conformance"
]
silk-version = "0.1.0-dev.90+43166993a300"
