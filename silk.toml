source = "src"
main = "tasks.silk"

[dependencies]
svg_image = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "27fe1c042203204009a7d86abc72b3c02fbaaa96", path = "modules/codec", package = "graphics-codec" }

[workspace]
members = [
  "bootstrap",
  "modules",
  "modules/filters",
  "modules/raster",
  "modules/text",
  "modules/render",
  "modules/gpu",
  "modules/gpu/tests",
  "modules/tests",
  "modules/bench",
  "modules/tools/wasm",
  "svg-render-test-harness",
  "xml-compatibility",
  "xml-conformance"
]
silk-version = "0.1.0-dev.100+8f42b4e7342a"
