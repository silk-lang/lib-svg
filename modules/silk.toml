[package]
name = "svg"
description = "An SVG renderer written from the SVG 1.1 and SVG 2 specifications"
version = "0.1.0"
silk-version = "0.1.0-dev.63+657e3c900f65"
kind = "library"
exports = ["image_assets", "mask_layer_sources", "svg_intrinsic", "scene", "mapping", "resolve", "url", "resources", "resources_native", "style_tree", "stylesheets", "document_styles", "font_metrics", "vector_path", "view_fragment", "view_selection", "conditional", "structure", "occurrence_tree", "animation", "css_animations", "color_profiles"]

[dependencies]
svg_geometry = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "3e4532ee810f7b28d6eb6c7331809de81cdcbc7e", path = "modules/geometry", package = "graphics-geometry" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "59730955d8a3393a6776468db2c2463ae5f29bd2", path = "modules/style", package = "css-style" }
svg_image = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "3e4532ee810f7b28d6eb6c7331809de81cdcbc7e", path = "modules/codec", package = "graphics-codec" }
font_types = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "4f07e6219d274b5247d39d6b3539958bf68bd00c", path = "modules/types", package = "font-types" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "4f07e6219d274b5247d39d6b3539958bf68bd00c", path = "modules/parse", package = "font-parse" }
