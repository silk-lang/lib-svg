[package]
name = "svg"
description = "An SVG renderer written from the SVG 1.1 and SVG 2 specifications"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["image_assets", "mask_layer_sources", "svg_intrinsic", "scene", "mapping", "resolve", "url", "resources", "resources_native", "style_tree", "stylesheets", "document_styles", "font_metrics", "vector_path", "view_fragment", "view_selection", "conditional", "structure", "occurrence_tree", "animation", "css_animations", "color_profiles"]

[dependencies]
svg_geometry = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "f3be99fcbf6f062c797a6af6b08999501fd3effd", path = "modules/geometry", package = "graphics-geometry" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "aaa6449e13bd792a83c4fe0b924758d755007389", path = "modules/style", package = "css-style" }
svg_image = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "f3be99fcbf6f062c797a6af6b08999501fd3effd", path = "modules/codec", package = "graphics-codec" }
font_types = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "550690a38491a9aeaf1d69ffb54e3921c0ce7115", path = "modules/types", package = "font-types" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "550690a38491a9aeaf1d69ffb54e3921c0ce7115", path = "modules/parse", package = "font-parse" }
harfrust = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "550690a38491a9aeaf1d69ffb54e3921c0ce7115", path = "modules/shape", package = "font-shape" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "f3be99fcbf6f062c797a6af6b08999501fd3effd", path = "modules/vector", package = "graphics-vector" }
svg_filters = { path = "filters", package = "svg-filters" }
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "550690a38491a9aeaf1d69ffb54e3921c0ce7115", path = "modules/faces", package = "font-faces" }
svg_text = { path = "text", package = "svg-text" }
css_properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "aaa6449e13bd792a83c4fe0b924758d755007389", path = "modules/properties", package = "css-properties" }
