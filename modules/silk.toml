svg_text = { path = "text", package = "svg-text" }
css_properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "728b3569381b3e0780e7d1e38bb8991eba65ff6a", path = "modules/properties", package = "css-properties" }
