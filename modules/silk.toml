[package]
name = "svg"
description = "An SVG renderer written from the SVG 1.1 and SVG 2 specifications"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["image_assets", "mask_layer_sources", "svg_intrinsic", "scene", "mapping", "resolve", "url", "resources", "resources_native", "style_tree", "stylesheets", "document_styles", "font_metrics", "vector_path", "view_fragment", "view_selection", "conditional", "structure", "occurrence_tree", "animation", "css_animations", "color_profiles"]

[dependencies]
svg_geometry = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7e3770cb41beaf709272548863f5b020f476765f", path = "modules/geometry", package = "graphics-geometry" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "fd22d66796ec889289885d26ec86b8618e976d33", path = "modules/style", package = "css-style" }
svg_image = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7e3770cb41beaf709272548863f5b020f476765f", path = "modules/codec", package = "graphics-codec" }
font_types = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "42edcde61d4bc4915997ab013a3cc7fe3ad7118f", path = "modules/types", package = "font-types" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "42edcde61d4bc4915997ab013a3cc7fe3ad7118f", path = "modules/parse", package = "font-parse" }
harfrust = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "42edcde61d4bc4915997ab013a3cc7fe3ad7118f", path = "modules/shape", package = "font-shape" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7e3770cb41beaf709272548863f5b020f476765f", path = "modules/vector", package = "graphics-vector" }
svg_filters = { path = "filters", package = "svg-filters" }
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "42edcde61d4bc4915997ab013a3cc7fe3ad7118f", path = "modules/faces", package = "font-faces" }
svg_text = { path = "text", package = "svg-text" }
css_properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "fd22d66796ec889289885d26ec86b8618e976d33", path = "modules/properties", package = "css-properties" }
