[package]
name = "svg"
description = "An SVG renderer written from the SVG 1.1 and SVG 2 specifications"
version = "0.1.0"
kind = "library"
exports = ["image_assets", "mask_layer_sources", "svg_intrinsic", "scene", "mapping", "resolve", "url", "resources", "resources_native", "style_tree", "stylesheets", "document_styles", "font_metrics", "vector_path", "view_fragment", "view_selection", "conditional", "structure", "occurrence_tree", "animation", "css_animations", "color_profiles"]

[dependencies]
svg_geometry = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "40ae5381a5522769d9fdfc2943f556ad3a94881b", path = "modules/geometry", package = "graphics-geometry" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "59a9e23a4f279f170ecd104330240bd8653bdd58", path = "modules/style", package = "css-style" }
svg_image = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "40ae5381a5522769d9fdfc2943f556ad3a94881b", path = "modules/codec", package = "graphics-codec" }
font_types = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "1d030000c258e62fd5ba822c3850ff4df3892782", path = "modules/types", package = "font-types" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "1d030000c258e62fd5ba822c3850ff4df3892782", path = "modules/parse", package = "font-parse" }
harfrust = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "1d030000c258e62fd5ba822c3850ff4df3892782", path = "modules/shape", package = "font-shape" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "40ae5381a5522769d9fdfc2943f556ad3a94881b", path = "modules/vector", package = "graphics-vector" }
svg_filters = { path = "filters", package = "svg-filters" }
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "1d030000c258e62fd5ba822c3850ff4df3892782", path = "modules/faces", package = "font-faces" }
svg_text = { path = "text", package = "svg-text" }
css_properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "59a9e23a4f279f170ecd104330240bd8653bdd58", path = "modules/properties", package = "css-properties" }
