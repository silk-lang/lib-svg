[package]
name = "svg-raster"
description = "CPU execution of backend-neutral SVG display lists"
version = "0.1.0"
kind = "library"
exports = ["canvas", "cpu", "lower"]

[dependencies]
svg_geometry = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "a4cc4a88efdcc88d9e0f14ad62710f71c0069c8c", path = "modules/geometry", package = "graphics-geometry" }
svg_core = { path = "..", package = "svg" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "a4cc4a88efdcc88d9e0f14ad62710f71c0069c8c", path = "modules/vector", package = "graphics-vector" }
svg_filters = { path = "../filters", package = "svg-filters" }
