[package]
name = "svg-raster"
description = "CPU execution of backend-neutral SVG display lists"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["canvas", "cpu", "lower"]

[dependencies]
svg_geometry = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "9d103d604967ce1e1917854ac6e0590d4c41a472", path = "modules/geometry", package = "graphics-geometry" }
svg_core = { path = "..", package = "svg" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "9d103d604967ce1e1917854ac6e0590d4c41a472", path = "modules/vector", package = "graphics-vector" }
svg_filters = { path = "../filters", package = "svg-filters" }
