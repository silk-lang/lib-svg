[package]
name = "svg-raster"
description = "CPU execution of backend-neutral SVG display lists"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["canvas", "cpu", "lower"]

[dependencies]
svg_geometry = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b9e9678237c8a300ea708a897f3bac0a5996c271", path = "modules/geometry", package = "graphics-geometry" }
svg_core = { path = "..", package = "svg" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b9e9678237c8a300ea708a897f3bac0a5996c271", path = "modules/vector", package = "graphics-vector" }
svg_filters = { path = "../filters", package = "svg-filters" }
