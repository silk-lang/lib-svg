[package]
name = "svg-render"
description = "Parses, resolves and renders SVG with the vector CPU backend"
version = "0.1.0"
silk-version = "0.1.0-dev.64+8214c402307b"
kind = "library"
exports = ["lib", "record", "environment", "native_environment"]

[dependencies]
svg_geometry = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1abcea13ffb39947c7375c196fc6e66b604ba741", path = "modules/geometry", package = "graphics-geometry" }
svg_core = { path = "..", package = "svg" }
svg_raster = { path = "../raster", package = "svg-raster" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "768cc36989df63ee836a008223fa0f3186d7fdeb", path = "modules/style", package = "css-style" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "a75b3044c22ea756158e4d5e12838f19a6554b3a", path = "modules/parse", package = "font-parse" }
# CPU output is the backend-owned pixmap; encoding borrows its pixels without a copy.
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1abcea13ffb39947c7375c196fc6e66b604ba741", path = "modules/vector", package = "graphics-vector" }
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "a75b3044c22ea756158e4d5e12838f19a6554b3a", path = "modules/faces", package = "font-faces" }
