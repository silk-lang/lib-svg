[package]
name = "svg-render"
description = "Parses, resolves and renders SVG with the vector CPU backend"
version = "0.1.0"
kind = "library"
exports = ["lib", "record", "environment", "native_environment"]

[dependencies]
svg_geometry = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c5fc48eb37e06b217ac96effa7801866e46f90ed", path = "modules/geometry", package = "graphics-geometry" }
svg_core = { path = "..", package = "svg" }
svg_raster = { path = "../raster", package = "svg-raster" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "8018f822fb4622c1f4fe50fa37a1307725406919", path = "modules/style", package = "css-style" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "aaaf14f23a6a764edaf999962cf173554fbe6141", path = "modules/parse", package = "font-parse" }
# CPU output is the backend-owned pixmap; encoding borrows its pixels without a copy.
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c5fc48eb37e06b217ac96effa7801866e46f90ed", path = "modules/vector", package = "graphics-vector" }
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "aaaf14f23a6a764edaf999962cf173554fbe6141", path = "modules/faces", package = "font-faces" }
