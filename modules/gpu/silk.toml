[package]
name = "svg-gpu"
description = "Draws SVG display lists on the GPU through graphics-gpu-scene"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
kind = "library"
exports = ["scene"]

[dependencies]
svg_core = { path = "..", package = "svg" }
svg_raster = { path = "../raster", package = "svg-raster" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "d3707f664669b8c9720a6488aa38c111b6e68ccf", path = "modules/vector", package = "graphics-vector" }
gpu_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "d3707f664669b8c9720a6488aa38c111b6e68ccf", path = "modules/gpu_scene", package = "graphics-gpu-scene" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "c55128b1813981384f284614988568c92dbdb11d", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
