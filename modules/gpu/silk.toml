[package]
name = "svg-gpu"
description = "Draws SVG display lists on the GPU through graphics-gpu-scene"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["scene"]

[dependencies]
svg_core = { path = "..", package = "svg" }
svg_raster = { path = "../raster", package = "svg-raster" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "2f0330b14e21d06879b5a12f874c4efedc80abdc", path = "modules/vector", package = "graphics-vector" }
gpu_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "2f0330b14e21d06879b5a12f874c4efedc80abdc", path = "modules/gpu_scene", package = "graphics-gpu-scene" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "b8a29e7a8dc9466a83ddf12719e81562280d05f5", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
