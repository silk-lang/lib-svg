[package]
name = "svg-text"
description = "SVG text layout: font selection, shaping, positioning and glyph outlines"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "layout", "lines", "areas", "paths", "on_path"]

[dependencies]
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "a9befcb2c2b2b29572aa0ba3fac3ac8b94cd1925", path = "modules/faces", package = "font-faces" }
harfrust = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "a9befcb2c2b2b29572aa0ba3fac3ac8b94cd1925", path = "modules/shape", package = "font-shape" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "a9befcb2c2b2b29572aa0ba3fac3ac8b94cd1925", path = "modules/parse", package = "font-parse" }
font_types = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "a9befcb2c2b2b29572aa0ba3fac3ac8b94cd1925", path = "modules/types", package = "font-types" }
svg_geometry = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "9d103d604967ce1e1917854ac6e0590d4c41a472", path = "modules/geometry", package = "graphics-geometry" }
font_outline = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "a9befcb2c2b2b29572aa0ba3fac3ac8b94cd1925", path = "modules/outline", package = "font-outline" }
css_properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "38c68256287f63e224214137ec2d5c1d485787bc", path = "modules/properties", package = "css-properties" }
