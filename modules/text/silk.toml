[package]
name = "svg-text"
description = "SVG text layout: font selection, shaping, positioning and glyph outlines"
version = "0.1.0"
kind = "library"
exports = ["lib", "layout", "lines", "areas", "paths", "on_path"]

[dependencies]
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ac46401d637fc7f658d88ff17ea13b0eb71ca974", path = "modules/faces", package = "font-faces" }
harfrust = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ac46401d637fc7f658d88ff17ea13b0eb71ca974", path = "modules/shape", package = "font-shape" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ac46401d637fc7f658d88ff17ea13b0eb71ca974", path = "modules/parse", package = "font-parse" }
font_types = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ac46401d637fc7f658d88ff17ea13b0eb71ca974", path = "modules/types", package = "font-types" }
svg_geometry = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "a11493a2ed16ec2767845090454b5ce1aa7d7eee", path = "modules/geometry", package = "graphics-geometry" }
font_outline = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ac46401d637fc7f658d88ff17ea13b0eb71ca974", path = "modules/outline", package = "font-outline" }
css_properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "c4bce4e90c7341d4974d578d9712072076da4d3c", path = "modules/properties", package = "css-properties" }
