[package]
name = "svg-text"
description = "SVG text layout: font selection, shaping, positioning and glyph outlines"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
kind = "library"
exports = ["lib", "layout", "lines", "areas", "paths", "on_path"]

[dependencies]
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ea3425ff6f35c387e532a7816d43e7fc6bfb1d4f", path = "modules/faces", package = "font-faces" }
harfrust = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ea3425ff6f35c387e532a7816d43e7fc6bfb1d4f", path = "modules/shape", package = "font-shape" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ea3425ff6f35c387e532a7816d43e7fc6bfb1d4f", path = "modules/parse", package = "font-parse" }
font_types = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ea3425ff6f35c387e532a7816d43e7fc6bfb1d4f", path = "modules/types", package = "font-types" }
svg_geometry = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "8e37c69b0b1bcbd56a3b0136d48ebe7e8606017e", path = "modules/geometry", package = "graphics-geometry" }
font_outline = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ea3425ff6f35c387e532a7816d43e7fc6bfb1d4f", path = "modules/outline", package = "font-outline" }
css_properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "5b4a597215d23b7067d073f022826eb9747cb255", path = "modules/properties", package = "css-properties" }
