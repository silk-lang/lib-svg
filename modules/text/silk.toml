[package]
name = "svg-text"
description = "SVG text layout: font selection, shaping, positioning and glyph outlines"
version = "0.1.0"
kind = "library"
exports = ["lib", "layout", "lines", "areas", "paths", "on_path"]

[dependencies]
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "7dc6b2d53568658488e91b84e96495c8c3d01aac", path = "modules/faces", package = "font-faces" }
harfrust = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "7dc6b2d53568658488e91b84e96495c8c3d01aac", path = "modules/shape", package = "font-shape" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "7dc6b2d53568658488e91b84e96495c8c3d01aac", path = "modules/parse", package = "font-parse" }
font_types = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "7dc6b2d53568658488e91b84e96495c8c3d01aac", path = "modules/types", package = "font-types" }
svg_geometry = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c53c6e39ede15ec199a19075de0e9c0650044ca4", path = "modules/geometry", package = "graphics-geometry" }
font_outline = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "7dc6b2d53568658488e91b84e96495c8c3d01aac", path = "modules/outline", package = "font-outline" }
css_properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "5ba23e2f3cbf0e5df924e3bce03e468ae0eae390", path = "modules/properties", package = "css-properties" }
