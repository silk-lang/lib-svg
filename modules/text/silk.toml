[package]
name = "svg-text"
description = "SVG text layout: font selection, shaping, positioning and glyph outlines"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "layout", "lines", "areas", "paths", "on_path"]

[dependencies]
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "d8aa6b88c2139b8c4d7e55a3b23b3512e8827bb9", path = "modules/faces", package = "font-faces" }
harfrust = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "d8aa6b88c2139b8c4d7e55a3b23b3512e8827bb9", path = "modules/shape", package = "font-shape" }
