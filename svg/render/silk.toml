[package]
name = "svg-render"
description = "Parses, resolves and renders SVG with the vector CPU backend"
version = "0.1.0"
silk-version = "0.1.0-dev.63+657e3c900f65"
kind = "library"
exports = ["lib", "record", "environment", "native_environment"]

[dependencies]
svg_geometry = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b1093a18d6333137c9ede3feef8f548790396fdd", path = "graphics/geometry", package = "graphics-geometry" }
svg_core = { path = "..", package = "svg" }
svg_raster = { path = "../raster", package = "svg-raster" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "15f9d5f0e6efce81fd896a193cd45c3fdafa191b", path = "css/style", package = "css-style" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ec44d02117695fe4ec3e11f8c6cd360fabe01261", path = "fonts/parse", package = "font-parse" }
# CPU output is the backend-owned pixmap; encoding borrows its pixels without a copy.
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b1093a18d6333137c9ede3feef8f548790396fdd", path = "graphics/vector", package = "graphics-vector" }
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ec44d02117695fe4ec3e11f8c6cd360fabe01261", path = "fonts/faces", package = "font-faces" }
