name: svg
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
concurrency:
  group: svg-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  rendering:
    name: Unit tests, CPU corpus, GPU and wasm parity
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache
            ~/.silk
            modules/.cache
            modules/tests/.cache
          key: svg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bootstrap/src/tasks.silk', '**/silk.toml', 'modules/*.lock.json', 'modules/tests/suites.lock.json') }}
      - name: Bootstrap pinned Silk
        run: |
          curl -fsSL https://raw.githubusercontent.com/silk-lang/silk/8214c402307b/install.sh | SILK_RELEASE=v0.1.0-dev.74+205aea3f5b2e sh
          echo "$HOME/.silk/bin" >> "$GITHUB_PATH"
      # Tasks are compiled programs: provision Clang 22 before any task.
      - name: Bootstrap Linux Clang
        run: |
          test -x /usr/bin/clang-22 && test -x /usr/lib/llvm-22/bin/ld.lld || { sudo apt-get update && sudo apt-get install -y clang-22 lld-22; }
          echo "SILK_CLANG=/usr/bin/clang-22" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
      - name: Fetch exact dependency revisions serially
        run: silk check --manifest-path modules/gpu/tests/silk.toml
      - name: Install task prerequisites and corpus fonts
        run: sudo apt-get update && sudo apt-get install -y cmake git g++ coreutils libarchive-dev libjpeg-turbo-progs fonts-dejavu-core fonts-freefont-ttf
      - run: silk task --manifest-path bootstrap/silk.toml install-lexbor
      - run: silk task --manifest-path bootstrap/silk.toml install-xerces
      - name: Prepare LLVM and lavapipe
        run: silk task setup-ci --linux-gpu
      - run: silk task check
      - run: silk task test-gpu
      - run: silk task check-wasm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-rendering
          path: build/svg/
          if-no-files-found: warn
  conformance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bootstrap pinned Silk
        run: |
          curl -fsSL https://raw.githubusercontent.com/silk-lang/silk/8214c402307b/install.sh | SILK_RELEASE=v0.1.0-dev.74+205aea3f5b2e sh
          echo "$HOME/.silk/bin" >> "$GITHUB_PATH"
      - name: Bootstrap Linux Clang
        run: |
          test -x /usr/bin/clang-22 && test -x /usr/lib/llvm-22/bin/ld.lld || { sudo apt-get update && sudo apt-get install -y clang-22 lld-22; }
          echo "SILK_CLANG=/usr/bin/clang-22" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
      - run: silk check --manifest-path modules/gpu/tests/silk.toml
      - run: sudo apt-get update && sudo apt-get install -y cmake git g++ coreutils libarchive-dev fonts-dejavu-core fonts-freefont-ttf
      - run: silk task --manifest-path bootstrap/silk.toml install-lexbor
      - run: silk task --manifest-path bootstrap/silk.toml install-xerces
      - run: silk task setup-ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: modules/tests/.cache/suites
          key: svg-conformance-${{ hashFiles('modules/tests/suites.lock.json') }}
      - run: silk task conformance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/svg-conformance/
          if-no-files-found: warn
          retention-days: 30
  benchmarks:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bootstrap pinned Silk
        run: |
          curl -fsSL https://raw.githubusercontent.com/silk-lang/silk/8214c402307b/install.sh | SILK_RELEASE=v0.1.0-dev.74+205aea3f5b2e sh
          echo "$HOME/.silk/bin" >> "$GITHUB_PATH"
      - name: Bootstrap Linux Clang
        run: |
          test -x /usr/bin/clang-22 && test -x /usr/lib/llvm-22/bin/ld.lld || { sudo apt-get update && sudo apt-get install -y clang-22 lld-22; }
          echo "SILK_CLANG=/usr/bin/clang-22" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
      - run: silk check --manifest-path modules/gpu/tests/silk.toml
      - run: sudo apt-get update && sudo apt-get install -y cmake git g++ coreutils libarchive-dev libjpeg-turbo-progs
      - run: silk task --manifest-path bootstrap/silk.toml install-lexbor
      - run: silk task --manifest-path bootstrap/silk.toml install-xerces
      - run: silk task setup-ci
      - name: Install recorded Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - run: silk build --release --manifest-path modules/bench/silk.toml
      - run: silk task benchmarks rust-build
      - run: silk task benchmarks bench --silk build/llvm/x86_64-unknown-linux-gnu/release/svg-bench --fetch-workloads --record-baseline --baseline build/svg/current-baseline.json --output build/svg/bench.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/svg/bench.json
          if-no-files-found: warn
